name: CoffeeNChill CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore POE_CoffeeNChill.slnx

      - name: Build solution
        run: dotnet build POE_CoffeeNChill.slnx --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test POE_CoffeeNChill.Tests/POE_CoffeeNChill.Tests.csproj --no-build --configuration Release